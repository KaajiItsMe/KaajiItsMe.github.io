<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPorto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="portoPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadowPorto" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgPorto)"/>

  <!-- Blueprint Lines -->
  <g stroke="#27272a" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Glowing orb -->
  <circle cx="400" cy="225" r="140" fill="#3b82f6" opacity="0.08" filter="blur(60px)"/>

  <!-- Browser Frame -->
  <g filter="url(#shadowPorto)">
    <rect x="150" y="75" width="500" height="300" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    <rect x="150" y="75" width="500" height="38" rx="12" fill="#18181b"/>
    <rect x="150" y="100" width="500" height="13" fill="#18181b"/>
    <line x1="150" y1="113" x2="650" y2="113" stroke="#27272a" stroke-width="1"/>

    <!-- Browser Dots -->
    <circle cx="175" cy="94" r="5" fill="#71717a"/>
    <circle cx="192" cy="94" r="5" fill="#71717a"/>
    <circle cx="209" cy="94" r="5" fill="#71717a"/>

    <!-- URL Bar -->
    <rect x="235" y="84" width="260" height="20" rx="5" fill="#27272a"/>
    <text x="365" y="98" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" text-anchor="middle">kaajiitsme.github.io</text>

    <!-- Inside Content Mockup -->
    <text x="250" y="175" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Halo, saya</text>
    <text x="250" y="208" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700">Kaaji.</text>
    <text x="250" y="235" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">UI/UX, Interface Design &amp; Development</text>
    <text x="250" y="260" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-style="italic">"Designing interfaces, connecting ideas, and building things that work."</text>

    <!-- Badges -->
    <g transform="translate(250, 290)">
      <rect x="0" y="0" width="70" height="22" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="35" y="15" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Jekyll</text>

      <rect x="80" y="0" width="85" height="22" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="122" y="15" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">GitHub Pages</text>

      <rect x="175" y="0" width="75" height="22" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="212" y="15" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Dark Mode</text>
    </g>
  </g>
</svg>

