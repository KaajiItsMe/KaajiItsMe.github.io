<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Ground -->
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- Browser Frame Surface -->
  <g transform="translate(140, 60)">
    <rect width="520" height="330" rx="8" fill="#151b23"/>

    <!-- Bar -->
    <rect width="520" height="40" rx="8" fill="#1c2430"/>
    <rect y="20" width="520" height="20" fill="#1c2430"/>

    <!-- Browser Dots -->
    <circle cx="24" cy="20" r="5" fill="#f85149"/>
    <circle cx="42" cy="20" r="5" fill="#d29922"/>
    <circle cx="60" cy="20" r="5" fill="#3fb950"/>

    <rect x="180" y="10" width="160" height="20" rx="4" fill="#0d1117"/>
    <text x="260" y="24" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">kaajiitsme.github.io</text>

    <!-- Inside Content -->
    <text x="40" y="90" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Halo, saya</text>
    <text x="40" y="125" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700">Kaaji.</text>
    <text x="40" y="155" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">UI/UX, Interface Design &amp; Development</text>
    <text x="40" y="195" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Designing interfaces, connecting ideas, and building things that work.</text>

    <!-- Badges Row -->
    <g transform="translate(40, 240)">
      <rect x="0" y="0" width="75" height="26" rx="4" fill="#21262d"/>
      <text x="37" y="17" fill="#f0f6fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Jekyll</text>

      <rect x="87" y="0" width="115" height="26" rx="4" fill="#21262d"/>
      <text x="144" y="17" fill="#f0f6fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">GitHub Pages</text>

      <rect x="214" y="0" width="105" height="26" rx="4" fill="#21262d"/>
      <text x="266" y="17" fill="#f0f6fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Vanilla JS</text>
    </g>
  </g>
