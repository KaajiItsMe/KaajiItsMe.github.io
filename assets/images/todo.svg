<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#30363d" stroke-width="1" opacity="0.3">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="140" fill="#3b82f6" opacity="0.12" filter="blur(40px)"/>
  <circle cx="620" cy="280" r="160" fill="#f59e0b" opacity="0.08" filter="blur(50px)"/>

  <!-- Main Window Container -->
  <g filter="url(#shadow)">
    <!-- Window Body -->
    <rect x="140" y="65" width="520" height="320" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect x="140" y="65" width="520" height="42" rx="14" fill="#161b22"/>
    <rect x="140" y="93" width="520" height="14" fill="#161b22"/>
    <line x1="140" y1="107" x2="660" y2="107" stroke="#30363d" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="165" cy="86" r="6" fill="#ef4444"/>
    <circle cx="185" cy="86" r="6" fill="#f59e0b"/>
    <circle cx="205" cy="86" r="6" fill="#10b981"/>
    
    <text x="400" y="91" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">ToDo App — Java Desktop &amp; Cloud Sync</text>

    <!-- Task Item 1 (Done) -->
    <rect x="170" y="130" width="460" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="198" cy="155" r="11" fill="#10b981"/>
    <path d="M193 155 L196 158 L203 151" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="224" y="159" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-decoration="line-through">Integrasi Firebase Firestore Realtime</text>
    <rect x="520" y="143" width="90" height="24" rx="12" fill="#1e293b"/>
    <text x="565" y="159" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">SYNCED</text>

    <!-- Task Item 2 (Active) -->
    <rect x="170" y="195" width="460" height="50" rx="8" fill="#1c2128" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="198" cy="220" r="11" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="224" y="224" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Smart Re-Open IPC via ServerSocket</text>
    <rect x="520" y="208" width="90" height="24" rx="12" fill="#1e3a5f"/>
    <text x="565" y="224" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">ACTIVE</text>

    <!-- Task Item 3 (Upcoming) -->
    <rect x="170" y="260" width="460" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="198" cy="285" r="11" fill="none" stroke="#6e7681" stroke-width="2"/>
    <text x="224" y="289" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">System Tray &amp; Deadline Push Notification</text>
    <rect x="520" y="273" width="90" height="24" rx="12" fill="#2d2616"/>
    <text x="565" y="289" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">ALERT</text>

    <!-- Footer Badges in Card -->
    <g transform="translate(170, 335)">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="52" y="18" fill="#fb923c" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">☕ Java Swing</text>

      <rect x="115" y="0" width="125" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="177" y="18" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔥 Firebase Cloud</text>

      <rect x="250" y="0" width="115" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="307" y="18" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🪟 Windows Exe</text>
    </g>
  </g>
</svg>

