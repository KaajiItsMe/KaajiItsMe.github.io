<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Ground -->
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- Window Container Surface -->
  <g transform="translate(140, 60)">
    <rect width="520" height="330" rx="8" fill="#151b23"/>

    <!-- Titlebar -->
    <rect width="520" height="40" rx="8" fill="#1c2430"/>
    <rect y="20" width="520" height="20" fill="#1c2430"/>

    <!-- Window Dots -->
    <circle cx="24" cy="20" r="5" fill="#f85149"/>
    <circle cx="42" cy="20" r="5" fill="#d29922"/>
    <circle cx="60" cy="20" r="5" fill="#3fb950"/>

    <text x="260" y="24" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">ToDo App — Java Desktop &amp; Cloud Sync</text>

    <!-- Task Item 1 -->
    <g transform="translate(24, 60)">
      <rect width="472" height="56" rx="6" fill="#0d1117"/>
      <circle cx="28" cy="28" r="10" fill="#238636"/>
      <path d="M24 28 L27 31 L33 24" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="50" y="32" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-decoration="line-through">Integrasi Firebase Firestore Realtime</text>
      <rect x="372" y="18" width="80" height="20" rx="4" fill="#1f2937"/>
      <text x="412" y="32" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">SYNCED</text>
    </g>

    <!-- Task Item 2 -->
    <g transform="translate(24, 130)">
      <rect width="472" height="56" rx="6" fill="#162338"/>
      <circle cx="28" cy="28" r="10" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="50" y="32" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Smart Re-Open IPC via ServerSocket</text>
      <rect x="372" y="18" width="80" height="20" rx="4" fill="#0c4a6e"/>
      <text x="412" y="32" fill="#7dd3fc" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text>
    </g>

    <!-- Task Item 3 -->
    <g transform="translate(24, 200)">
      <rect width="472" height="56" rx="6" fill="#0d1117"/>
      <circle cx="28" cy="28" r="10" fill="none" stroke="#6e7681" stroke-width="2"/>
      <text x="50" y="32" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">System Tray &amp; Deadline Push Notification</text>
      <rect x="372" y="18" width="80" height="20" rx="4" fill="#362507"/>
      <text x="412" y="32" fill="#e3b341" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ALERT</text>
    </g>

    <!-- Specs Bar -->
    <g transform="translate(24, 276)">
      <rect x="0" y="0" width="100" height="26" rx="4" fill="#21262d"/>
      <text x="50" y="17" fill="#f0f6fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Java Swing</text>

      <rect x="112" y="0" width="120" height="26" rx="4" fill="#21262d"/>
      <text x="172" y="17" fill="#f0f6fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Firebase Cloud</text>

      <rect x="244" y="0" width="105" height="26" rx="4" fill="#21262d"/>
      <text x="296" y="17" fill="#f0f6fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Windows Exe</text>
    </g>
  </g>
</svg>
