<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Ground -->
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- Discovery Card Container -->
  <g transform="translate(140, 60)">
    <rect width="520" height="330" rx="8" fill="#151b23"/>

    <!-- Header -->
    <rect width="520" height="56" rx="8" fill="#1c2430"/>
    <rect y="36" width="520" height="20" fill="#1c2430"/>

    <!-- Lens Icon (Pure SVG Vector) -->
    <circle cx="36" cy="28" r="14" fill="#0c4a6e"/>
    <path d="M31 23 A 5 5 0 1 0 37 29 A 5 5 0 1 0 31 23 M39 31 L43 35" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>

    <text x="64" y="27" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">LokaLens AI</text>
    <text x="64" y="44" fill="#8b949e" font-family="sans-serif" font-size="11">AI-Powered Local Discovery Platform</text>

    <!-- Case Study Pill -->
    <rect x="390" y="16" width="105" height="24" rx="4" fill="#21262d"/>
    <text x="442" y="32" fill="#f0f6fc" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">CASE STUDY</text>

    <!-- Feature Row 1 -->
    <g transform="translate(24, 80)">
      <rect width="472" height="60" rx="6" fill="#0d1117"/>
      <circle cx="30" cy="30" r="14" fill="#162338"/>
      <!-- Compass Vector -->
      <path d="M26 24 L33 27 L34 34 L27 31 Z" fill="#38bdf8"/>
      <text x="56" y="26" fill="#f0f6fc" font-family="sans-serif" font-size="13" font-weight="600">Rekomendasi Berbasis AI</text>
      <text x="56" y="44" fill="#8b949e" font-family="sans-serif" font-size="11">Kurasi hidden gems dan spot lokal terpersonalisasi</text>
    </g>

    <!-- Feature Row 2 -->
    <g transform="translate(24, 155)">
      <rect width="472" height="60" rx="6" fill="#0d1117"/>
      <circle cx="30" cy="30" r="14" fill="#142e22"/>
      <!-- Map Pin Vector -->
      <path d="M30 20 A 4 4 0 0 0 26 24 C26 28 30 35 30 35 C30 35 34 28 34 24 A 4 4 0 0 0 30 20 Z" fill="#3fb950"/>
      <text x="56" y="26" fill="#f0f6fc" font-family="sans-serif" font-size="13" font-weight="600">Review Komunitas &amp; Estimasi Anggaran</text>
      <text x="56" y="44" fill="#8b949e" font-family="sans-serif" font-size="11">Data suasana tempat, kapasitas parkir, dan estimasi biaya</text>
    </g>

    <!-- Tags Row -->
    <g transform="translate(24, 240)">
      <rect x="0" y="0" width="105" height="26" rx="4" fill="#21262d"/>
      <text x="52" y="17" fill="#f0f6fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">AI Discovery</text>

      <rect x="117" y="0" width="130" height="26" rx="4" fill="#21262d"/>
      <text x="182" y="17" fill="#f0f6fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Recommendation</text>

      <rect x="259" y="0" width="105" height="26" rx="4" fill="#21262d"/>
      <text x="311" y="17" fill="#f0f6fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Hidden Gems</text>
    </g>
  </g>
</svg>
