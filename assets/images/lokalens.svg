<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLoka" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadowLoka" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgLoka)"/>

  <!-- Radar / Discovery Rings -->
  <g stroke="#0e7490" stroke-width="1" opacity="0.25" fill="none">
    <circle cx="400" cy="225" r="80"/>
    <circle cx="400" cy="225" r="160" stroke-dasharray="6,6"/>
    <circle cx="400" cy="225" r="240"/>
    <circle cx="400" cy="225" r="320" stroke-dasharray="10,10"/>
    <line x1="80" y1="225" x2="720" y2="225"/>
    <line x1="400" y1="50" x2="400" y2="400"/>
  </g>

  <!-- Glowing Blurs -->
  <circle cx="340" cy="180" r="120" fill="#06b6d4" opacity="0.1" filter="blur(40px)"/>
  <circle cx="480" cy="260" r="130" fill="#10b981" opacity="0.08" filter="blur(50px)"/>

  <!-- Floating Discovery Card -->
  <g filter="url(#shadowLoka)">
    <rect x="150" y="70" width="500" height="310" rx="16" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Header inside card -->
    <rect x="150" y="70" width="500" height="60" rx="16" fill="#0f172a"/>
    <rect x="150" y="110" width="500" height="20" fill="#0f172a"/>
    <line x1="150" y1="130" x2="650" y2="130" stroke="#1e293b" stroke-width="1"/>

    <!-- Lens Icon -->
    <g transform="translate(180, 85)">
      <circle cx="15" cy="15" r="15" fill="url(#cyanGrad)"/>
      <path d="M12 12 A 4 4 0 1 0 18 18 A 4 4 0 1 0 12 12 M20 20 L23 23" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <text x="225" y="102" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">LokaLens AI</text>
    <text x="225" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11">AI-Powered Local Discovery Platform</text>

    <!-- Inactive / Case Study Badge -->
    <rect x="520" y="87" width="105" height="26" rx="13" fill="#334155"/>
    <text x="572" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">CASE STUDY</text>

    <!-- Feature Row 1: AI Discovery Pin -->
    <g transform="translate(180, 150)">
      <rect x="0" y="0" width="440" height="48" rx="8" fill="#131d36" stroke="#1e293b" stroke-width="1"/>
      <circle cx="24" cy="24" r="12" fill="#0891b2" opacity="0.2"/>
      <text x="24" y="28" fill="#38bdf8" font-family="sans-serif" font-size="13" text-anchor="middle">✨</text>
      <text x="48" y="22" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Rekomendasi Tempat Berbasis AI</text>
      <text x="48" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Kurasi hidden gems &amp; spot unik terpersonalisasi</text>
    </g>

    <!-- Feature Row 2: Community Insights & Budget -->
    <g transform="translate(180, 210)">
      <rect x="0" y="0" width="440" height="48" rx="8" fill="#131d36" stroke="#1e293b" stroke-width="1"/>
      <circle cx="24" cy="24" r="12" fill="#059669" opacity="0.2"/>
      <text x="24" y="28" fill="#34d399" font-family="sans-serif" font-size="13" text-anchor="middle">📍</text>
      <text x="48" y="22" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Review Komunitas &amp; Estimasi Anggaran</text>
      <text x="48" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Informasi suasana, fasilitas parkir, dan kisaran biaya</text>
    </g>

    <!-- Feature Row 3: Tags -->
    <g transform="translate(180, 280)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b"/>
      <text x="55" y="17" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🤖 AI Discovery</text>

      <rect x="120" y="0" width="130" height="26" rx="6" fill="#1e293b"/>
      <text x="185" y="17" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🧭 Recommendation</text>

      <rect x="260" y="0" width="105" height="26" rx="6" fill="#1e293b"/>
      <text x="312" y="17" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🗺️ Hidden Gems</text>
    </g>
  </g>
</svg>

