about_bio_p1: "Halo, saya **Eka Aji Pramudia**, dikenal sebagai **Kaaji**, dari Makassar, Indonesia."
about_bio_p2: "Saya tertarik pada pengembangan produk digital, terutama **UI/UX Design, perancangan interface, design thinking, dan pengembangan website**."
about_bio_p3: "Saya suka memikirkan bagaimana sebuah tampilan seharusnya bekerja, bukan hanya bagaimana tampilannya terlihat. Mulai dari menyusun layout, menentukan alur interaksi, memikirkan pengalaman pengguna, sampai menghubungkan elemen antarmuka dengan logika dan fungsi di baliknya."
about_bio_p4: "Bagi saya, desain dan development bukan dua hal yang terpisah. Keduanya perlu saling terhubung agar menghasilkan produk yang tidak hanya menarik secara visual, tetapi juga nyaman digunakan dan benar-benar berfungsi."
